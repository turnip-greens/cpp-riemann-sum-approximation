<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riemann Sum Approximation</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #24292e;
      --border-color: #e1e4e8;
      --accent-color: #0366d6;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-stack);
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      font-weight: 600;
      font-size: 0.95rem;
      color: #586069;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
    }

    button {
      background-color: #fafbfc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-color);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #f3f4f6;
    }

    progress {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .canvas-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas.emscripten {
      border: 0 none;
      background-color: #000;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="status-container">
        <div class="spinner" id="spinner"></div>
        <div id="status">Downloading...</div>
      </div>

      <div class="controls">
        <label>
          <input type="checkbox" id="resize">
          Resize
        </label>
        <label>
          <input type="checkbox" id="pointerLock" checked>
          Lock Pointer
        </label>
        <button onclick="Module.requestFullscreen(
          document.getElementById('pointerLock').checked,
          document.getElementById('resize').checked
        )">Fullscreen</button>
      </div>
    </div>

    <progress value="0" max="100" id="progress" hidden></progress>

    <div class="canvas-wrapper">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
  </div>

  <script type="text/javascript">
    const statusElement = document.getElementById('status');
    const progressElement = document.getElementById('progress');
    const spinnerElement = document.getElementById('spinner');
    const canvasElement = document.getElementById('canvas');

    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. Please reload the page.');
      e.preventDefault();
    }, false);

    const setStatus = (text) => {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;

      const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      const now = Date.now();

      if (m && now - setStatus.last.time < 30) return;

      setStatus.last.time = now;
      setStatus.last.text = text;

      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.style.display = 'inline-block';
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text;
    };

    var Module = {
      print(...args) {
        console.log(...args);
      },
      printErr(...args) {
        console.error(...args);
      },
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left ? `Preparing... (${this.totalDependencies - left}/${this.totalDependencies})` : 'All downloads complete.');
      }
    };

    setStatus('Downloading...');

    window.onerror = window.onunhandledrejection = () => {
      setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      setStatus = (text) => {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
  </script>
  <script async type="text/javascript" src="cpp-riemann-sum-approximation.js"></script>
</body>
</html>
